# Project-wide Gradle settings — non-secret build configuration only.
android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Release signing is read from project properties: KEYSTORE_PATH,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (see app/build.gradle).
# Do NOT put those here — this file is committed to the public repo.
# Provide them in your global ~/.gradle/gradle.properties (outside any repo),
# or pass them with -P on the command line. A build without them (e.g. F-Droid)
# simply produces an unsigned release.
#
# org.gradle.java.home was intentionally removed — it was a machine-specific
# absolute path that broke builds on every other machine. Let Gradle pick the
# JDK from JAVA_HOME / the toolchain instead.
